<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adicionar Carro | MotorPlace</title>

  <!-- CSS base e tokens -->
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/primitives.css">
  <link rel="stylesheet" href="../css/semantic.css">
  <link rel="stylesheet" href="../css/spacing.css">
  <link rel="stylesheet" href="../css/typography.css">
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/utilities.css">

  <!-- CSS do componente Add Car -->
  <link rel="stylesheet" href="../css/components/add-car-form.css">
  <link rel="stylesheet" href="../css/components/add-car-button.css">
</head>

<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html" aria-label="Página inicial da MotorPlace">
        <img
          src="../uploads/logo.png"
          alt="Logo MotorPlace"
          width="50"
          height="50"
        />
        <span class="brand-text">MotorPlace</span>
      </a>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container">
        <h2>Adicionar Novo Carro</h2>

        <!-- Formulário -->
        <form id="add-car-form" class="add-car-form-container" enctype="multipart/form-data">
          <div class="form-group">
            <label for="car-name">Nome do carro</label>
            <input
              type="text"
              id="car-name"
              name="carName"
              placeholder="Ex.: Honda Civic Touring 2022"
              required
            />
          </div>

          <div class="form-group">
            <label for="car-brand">Marca</label>
            <input
              type="text"
              id="car-brand"
              name="carBrand"
              placeholder="Ex.: Honda"
              required
            />
          </div>

          <div class="form-group">
            <label for="car-model">Modelo</label>
            <input
              type="text"
              id="car-model"
              name="carModel"
              placeholder="Ex.: Civic Touring"
              required
            />
          </div>

          <div class="form-group">
            <label for="car-type">Tipo</label>
            <select id="car-type" name="carType" required>
              <option value="">Selecione</option>
              <option value="SUV">SUV</option>
              <option value="Sedan">Sedan</option>
              <option value="Hatch">Hatch</option>
              <option value="Pickup">Pickup</option>
              <option value="Elétrico">Elétrico</option>
            </select>
          </div>

          <div class="form-group">
            <label for="car-year">Ano</label>
            <input
              type="number"
              id="car-year"
              name="carYear"
              placeholder="Ex.: 2022"
              required
            />
          </div>

          <div class="form-group">
            <label for="car-km">Quilometragem</label>
            <input
              type="number"
              id="car-km"
              name="carKm"
              placeholder="Ex.: 32000"
              required
            />
          </div>

          <div class="form-group">
            <label for="car-fuel">Combustível</label>
            <input
              type="text"
              id="car-fuel"
              name="carFuel"
              placeholder="Ex.: Flex, Diesel, Gasolina"
              required
            />
          </div>

          <div class="form-group">
            <label for="car-transmission">Câmbio</label>
            <select id="car-transmission" name="carTransmission" required>
              <option value="">Selecione</option>
              <option value="Manual">Manual</option>
              <option value="Automático">Automático</option>
              <option value="CVT">CVT</option>
            </select>
          </div>

          <div class="form-group">
            <label for="car-color">Cor</label>
            <input
              type="text"
              id="car-color"
              name="carColor"
              placeholder="Ex.: Branco"
              required
            />
          </div>

          <div class="form-group">
            <label for="car-location">Localização</label>
            <input
              type="text"
              id="car-location"
              name="carLocation"
              placeholder="Ex.: João Pessoa - PB"
              required
            />
          </div>

          <div class="form-group">
            <label for="car-price">Preço (R$)</label>
            <input
              type="number"
              id="car-price"
              name="carPrice"
              step="0.01"
              placeholder="Ex.: 149900"
              required
            />
          </div>

          <div class="form-group">
            <label for="car-img">Imagem do carro</label>
            <input
              type="file"
              id="car-img"
              name="carImage"
              accept="image/*"
              required
            />
          </div>

          <div class="form-group">
            <label for="car-description">Descrição</label>
            <textarea
              id="car-description"
              name="carDescription"
              rows="4"
              placeholder="Descreva o estado do carro, opcionais e diferenciais."
              required
            ></textarea>
          </div>

          <button type="submit" class="btn-primary">Adicionar Carro</button>
        </form>
      </div>
    </section>
  </main>

  <!-- Script do AddCar.js -->
  <script src="../js/AddCar.js"></script>
</body>
</html>
